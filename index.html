<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nolan Pierce</title>
  <meta name="description" content="Systems &amp; hardware tinkerer in LA, turning late-night ideas into working prototypes and tiny tools.">
  <link rel="icon" href="https://github.com/nolanpix.png?size=64">
  <style>
    :root {
      --bg: #faf7f2; --fg: #1d1b26; --muted: #6b6676; --accent: #d9480f; --line: #e7e1d8;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14121a; --fg: #f1ede6; --muted: #a39cae; --accent: #ff8a4c; --line: #2a2633; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 17px/1.65 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    main { width: min(560px, 100% - 48px); padding: 64px 0; }
    .avatar { width: 96px; height: 96px; border-radius: 50%; display: block; margin-bottom: 28px; background: var(--line); }
    h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.02em; }
    .role { margin: 0 0 28px; color: var(--muted); }
    p { margin: 0 0 18px; }
    .note { padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); font-size: 0.95rem; }
    nav { display: flex; gap: 20px; margin-top: 32px; }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    footer { margin-top: 48px; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img class="avatar" src="https://github.com/nolanpix.png?size=192" alt="Nolan Pierce" width="96" height="96">
    <h1>Nolan Pierce</h1>
    <p class="role">Systems &amp; hardware tinkerer · Los Angeles</p>
    <p>I turn weird late-night ideas into working prototypes, tiny tools, and the occasional bit of chaos. Everything here is built in public.</p>
    <p class="note">This site is just getting started — projects and notes will land here soon.</p>
    <nav>
      <a href="https://github.com/nolanpix">GitHub</a>
      <a href="https://x.com/nolanpierce_lab">X</a>
    </nav>
    <footer>© 2026 Nolan Pierce</footer>
  </main>
</body>
</html>
