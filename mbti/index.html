:root{
  --paper:#141413; --paper-2:#1F1F1D; --ink:#F2F2EF; --ink-2:#BDBDB7; --ink-3:#93938D; --hair:#3A3A37;
  --mark:#FF6A5F; --mark-wash:rgba(255,106,95,.12); --scrim:rgba(0,0,0,.65);
  --acc-a:#ff5a3c; --acc-b:#c0398f;
  --zh:"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  --lat:"Anybody","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --ill-plate:#1a2030; --ill-plate2:#222a3d; --ill-floor:#1b1d22; --ill-shadow:#0b0c10;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme]){--paper:#F2F2EF;--paper-2:#FFFFFF;--ink:#000000;--ink-2:#4A4A47;--ink-3:#6B6B66;--hair:#CFCFCA;--mark:#C4161C;--mark-wash:rgba(196,22,28,.07);--scrim:rgba(0,0,0,.5);--ill-plate:#E4E8EE;--ill-plate2:#D3D9E2;--ill-floor:#E6E4DD;--ill-shadow:#C9C6BC;color-scheme:light}
}
:root[data-theme="light"]{--paper:#F2F2EF;--paper-2:#FFFFFF;--ink:#000000;--ink-2:#4A4A47;--ink-3:#6B6B66;--hair:#CFCFCA;--mark:#C4161C;--mark-wash:rgba(196,22,28,.07);--scrim:rgba(0,0,0,.5);--ill-plate:#E4E8EE;--ill-plate2:#D3D9E2;--ill-floor:#E6E4DD;--ill-shadow:#C9C6BC;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:100px;font-size:12px;line-height:1.7;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--hair)}
.pin{display:inline-block;width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,var(--acc-a),var(--acc-b));box-shadow:0 0 8px rgba(255,90,60,.55)}
.grad{background:linear-gradient(90deg,var(--acc-a),var(--acc-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.role{margin-top:14px}
.role .art{margin:0 -8px 14px}
.role .k{font-size:14px;color:var(--ink-2)}
.role .nm{font-size:clamp(34px,10vw,48px);font-weight:700;line-height:1.15;margin:4px 0 2px}
.role .cd{font-family:var(--lat);font-weight:600;font-size:20px;letter-spacing:.04em}
.role .tg{font-size:14px;color:var(--ink-2);margin-top:8px;line-height:1.6}
.art svg{display:block;width:100%;height:auto}
.settle{animation:settle .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes settle{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.detail-cta{margin-top:28px;padding:18px;border-radius:12px;background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--hair);position:relative}
.detail-cta::after{content:"";position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,var(--acc-a),var(--acc-b))}
.detail-cta p{font-size:15px;color:var(--ink-2);margin-bottom:12px}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.toc a{text-decoration:none}
.at{display:grid;gap:10px;margin-top:12px}
.at div{padding:12px 14px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--hair)}
.at b{display:block;font-size:15px;margin-bottom:2px}
.at p{font-size:15px;color:var(--ink-2);line-height:1.7}
.tlist .th{width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--ill-plate);flex:none}
.tlist .th svg{width:52px;height:52px;display:block}
.th .ill-bg,.th .ill-sc,.th .ill-fg{display:none}
.tlist .rl{display:block;font-size:13px;color:var(--ink-2);font-family:var(--zh);font-weight:500;letter-spacing:0}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--zh);font-size:16px;line-height:1.75;min-height:100vh;-webkit-font-smoothing:antialiased}
::selection{background:var(--ink);color:var(--paper)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
h1:focus,h2:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:560px;margin:0 auto;padding:0 24px calc(48px + env(safe-area-inset-bottom))}
@media (max-width:359px){.app{padding-left:18px;padding-right:18px}}
.lat{font-family:var(--lat);font-variant-numeric:tabular-nums}

/* bar */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:env(safe-area-inset-top)}
.home{display:inline-flex;align-items:center;gap:5px;font-size:13px;line-height:1;color:var(--ink-3);text-decoration:none;padding:12px 8px 6px 0}
.home:hover{color:var(--ink)}
.home svg{margin-left:-3px}
.home .np{font-family:var(--lat);font-weight:700;letter-spacing:-.01em}
.theme-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;color:var(--ink-3);margin-right:-6px}
.theme-btn:hover{color:var(--ink);background:var(--paper-2)}
.theme-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:root:not([data-theme]) .theme-btn{display:none}
:root[data-theme="dark"] .theme-btn .i-sun,
:root[data-theme="light"] .theme-btn .i-moon{display:none}
.bar{height:60px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.bar .bl{justify-self:start}.bar .br{justify-self:end}
.brand{font-size:14px;font-weight:600;text-decoration:none;padding:10px 0;display:inline-block}
.brand .lat{font-weight:700;letter-spacing:.02em}
.navlink{font-size:14px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--hair);padding:12px 2px;display:inline-block}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;margin-left:-10px;border-radius:10px;text-decoration:none}
.count{font-family:var(--lat);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.count span{font-weight:300;color:var(--ink-2)}

/* type */
h1.t{font-size:28px;line-height:1.3;font-weight:700;margin-top:14px;letter-spacing:.01em}
h1.t.small{font-size:20px;margin-top:6px}
.lead{font-size:16px;color:var(--ink-2);margin-top:10px}
h2.s{font-size:19px;line-height:1.4;font-weight:700;margin:44px 0 14px}
p.b{font-size:16px}
p.b+p.b{margin-top:10px}
.note{font-size:13px;line-height:1.7;color:var(--ink-3)}
.meta{font-size:13px;color:var(--ink-3);font-weight:400;margin-left:8px;letter-spacing:0}

/* letters as chart */
.chart{margin-top:14px;border-top:1.5px solid var(--ink);padding-top:6px}
.letters{display:grid;grid-template-columns:repeat(4,1fr);align-items:end;font-family:var(--lat);font-size:clamp(64px,25vw,128px);line-height:.95}
.letters span{text-align:center;font-weight:400;display:block}
.letters.anim span{transition:font-weight .8s cubic-bezier(.2,.7,.2,1)}
.reads{display:grid;grid-template-columns:repeat(4,1fr);margin-top:8px;border-top:1px solid var(--hair);padding-top:10px}
.reads div{text-align:center;font-size:13px;line-height:1.5;color:var(--ink-2)}
.reads b{display:inline-block;font-family:var(--lat);font-weight:600;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.5;position:relative;padding:0 4px}
.reads .u,.reads .u b{color:var(--mark)}
.reads .u b::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:32px;transform:translate(-50%,-50%);border:1.5px solid var(--mark);border-radius:50%}
.reads small{display:block;font-size:12px;color:var(--ink-3)}
.reads .u small{color:var(--mark)}
.legend{font-size:13px;color:var(--ink-3);margin-top:12px}

/* home */
.choice{display:grid;gap:10px;margin-top:28px}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 18px;border-radius:10px;background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--hair)}
.opt strong{font-weight:600}
.opt .sub{font-size:14px;color:var(--ink-2)}
.opt[aria-checked="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.opt[aria-checked="true"] .sub{color:var(--paper)}
.resume{margin-top:28px;padding:16px 18px;border-radius:10px;background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--hair)}
.resume p{font-size:15px;margin-bottom:12px}
.last{font-size:15px;margin-top:18px;color:var(--ink-2)}
.last a{color:var(--ink);font-weight:600;text-underline-offset:3px;text-decoration-color:var(--hair)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 18px;border-radius:10px;font-size:17px;font-weight:600;background:var(--ink);color:var(--paper);text-decoration:none;text-align:center}
.btn.sec{background:var(--paper-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair);font-weight:500;font-size:16px;min-height:48px}
.btn:active{transform:translateY(1px)}
.stack{display:grid;gap:12px}
.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.textbtn{font-size:15px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--hair);padding:12px 8px}
.sep{margin-top:28px;padding-top:12px;border-top:1px solid var(--hair);text-align:center}
.confirm{margin-top:8px;text-align:left}
.confirm p{font-size:15px;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* quiz */
.ticks{display:flex;justify-content:space-between;align-items:flex-end;height:16px;margin-top:2px}
.ticks i{display:block;width:1.5px;height:8px;background:var(--hair);border-radius:1px}
.ticks i.d{background:var(--ink);height:11px}
.ticks i.c{background:var(--ink);height:16px;width:3px}
.qwrap{margin-top:28px}
.prompt{font-size:22px;line-height:1.5;font-weight:700}
.st{font-size:19px;line-height:1.6;margin-top:22px;font-weight:400;transition:color .15s}
.st.w-light{font-weight:300;color:var(--ink-3)}
.st.w-med{font-weight:500}
.st.w-heavy{font-weight:700}
.opts{display:grid;gap:8px;margin:20px 0}
.ans{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 16px;border-radius:10px;background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--hair);font-size:16px}
.ans.strong{font-weight:600}
.ans svg{display:block}
.ans[aria-checked="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.hint{font-size:13px;color:var(--ink-3);margin-top:20px}
.fade{animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* result */
.banner{margin-top:6px;padding:12px 16px;border-radius:10px;background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--hair);font-size:15px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px}
.banner a{font-weight:600;text-underline-offset:3px;text-decoration-color:var(--hair);padding:6px 0}
.flag{display:grid;grid-template-columns:16px 1fr;gap:8px;align-items:start;color:var(--mark);font-size:14px;line-height:1.7;margin-top:10px}
.flag svg{margin-top:4px}
.flag a{color:var(--mark);font-weight:600;text-underline-offset:3px;white-space:nowrap}
.one{font-size:18px;line-height:1.65;font-weight:600;margin-top:28px}
.one+p.b{margin-top:10px;color:var(--ink-2)}
.more{margin-top:24px;padding:16px 18px;border-radius:10px;background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--hair)}
.more p{font-size:15px;margin-bottom:12px}
.dims{display:grid;gap:14px}
.dim{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:baseline}
.dim .lt{font-family:var(--lat);font-size:34px;line-height:1;text-align:center}
.dim p{font-size:15px;line-height:1.75}
.dim strong{font-weight:600}
.dim .u strong{color:var(--mark)}
.fx{display:grid;grid-template-columns:72px 1fr;gap:2px 12px;padding:16px 0;border-top:1px solid var(--hair);align-items:baseline}
.fx:last-of-type{border-bottom:1px solid var(--hair)}
.fx .code{font-family:var(--lat);font-size:40px;line-height:1;grid-row:span 2}
.fx .nm{font-size:16px;font-weight:600}
.fx .pos{font-size:13px;color:var(--ink-3);font-weight:400;margin-left:8px}
.fx p{grid-column:2;font-size:15px;line-height:1.7;color:var(--ink-2)}
.after-fx{margin-top:10px}
ul.tips{list-style:none;display:grid;gap:12px}
ul.tips li{font-size:15px;line-height:1.75;padding-left:18px;position:relative}
ul.tips li::before{content:"";position:absolute;left:2px;top:.85em;width:7px;height:1.5px;background:var(--ink)}

/* types */
.tlist{list-style:none;margin-top:20px;border-top:1px solid var(--hair)}
.tlist a{display:grid;grid-template-columns:52px 76px 1fr 16px;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair);text-decoration:none}
.tlist .code{font-family:var(--lat);font-size:22px;font-weight:600;letter-spacing:.02em}
.tlist .one{font-size:14px;line-height:1.6;color:var(--ink-2);margin:0;font-weight:400}
.tlist .mine{display:block;font-size:12px;color:var(--mark);font-weight:600}
.tcode{font-family:var(--lat);font-weight:600;font-size:clamp(56px,18vw,84px);line-height:1;margin-top:18px;letter-spacing:.02em}
.relate{margin-top:14px;font-size:14px;color:var(--ink-2)}
.pairs{display:grid;gap:14px}
.pair{display:grid;grid-template-columns:72px 1fr;gap:12px}
.pair .lt{font-family:var(--lat);font-weight:600;font-size:22px;line-height:1.5}
.pair p{font-size:15px;line-height:1.75}
.pair p small{display:block;font-size:13px;color:var(--ink-3)}

/* sheet + toast */
.sheet-wrap{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:20}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--paper);border-radius:16px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{font-size:18px;font-weight:700}
.sheet .note{margin:6px 0 14px}
.sheet img{display:block;width:100%;height:auto;border-radius:8px;box-shadow:0 0 0 1px var(--hair);-webkit-touch-callout:default}
.sheet input{width:100%;font:inherit;font-size:14px;padding:12px;border-radius:10px;border:1px solid var(--hair);background:var(--paper-2);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.payqr,.payqr-note{display:none}
.payqr{width:188px;margin:2px auto 8px;padding:12px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px var(--hair)}
.payqr svg{display:block;width:100%;height:auto}
@media (min-width:700px){.payqr,.payqr-note{display:block}.payqr-note{text-align:center;margin-bottom:14px}}
.ulabel{display:block;font-size:14px;font-weight:600;margin:18px 0 6px}
.uerr{min-height:1.7em;font-size:14px;line-height:1.7;color:var(--mark);margin:6px 0 4px}
.noscript{padding:40px 0;font-size:16px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
(function () {
  var root = document.documentElement;
  var btn = document.querySelector('[data-theme-toggle]');
  var meta = document.getElementById('np-theme-color');
  function sync() {
    var light = root.getAttribute('data-theme') === 'light';
    if (meta) { meta.setAttribute('content', light ? '#F2F2EF' : '#141413'); }
    if (!btn) { return; }
    var label = light ? '切换到深色模式' : '切换到浅色模式';
    btn.setAttribute('aria-label', label);
    btn.title = label;
  }
  if (btn) {
    btn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('np:theme', next); } catch (e) { /* private mode */ }
      sync();
    });
  }
  sync();
})();
</script>

  'use strict';
  var D = {"version":"2026-11-26","siteUrl":"https://nolanpix.github.io/mbti/","items":[{"id":1,"dim":"EI","n":1,"top":"first","prompt":"忙完一周，周五晚上空出来了。","first":"约几个人出去吃饭聊天，热闹一阵就缓过来了。","second":"回家一个人待着，安静一阵就缓过来了。"},{"id":2,"dim":"EI","n":2,"top":"second","prompt":"碰到一个想不通的问题。","first":"找人聊一聊，说着说着思路就清楚了。","second":"先自己想一想，理出头绪再找人商量。"},{"id":3,"dim":"EI","n":3,"top":"first","prompt":"开会讨论一个新方案。","first":"边听边说，想到什么先抛出来。","second":"先听大家说，想清楚了再开口。"},{"id":4,"dim":"EI","n":4,"top":"second","prompt":"刚加入一个新团队。","first":"主动找人聊，很快就和大家熟了。","second":"先观察一阵，再和几个人慢慢熟起来。"},{"id":5,"dim":"EI","n":5,"top":"first","prompt":"连着和人打了一整天交道。","first":"还挺有精神，晚上也愿意再约人见面。","second":"有点累了，很想关上门安静待一会儿。"},{"id":6,"dim":"EI","n":6,"top":"second","prompt":"说到你的朋友圈子。","first":"认识的人很多，各种场合都有能聊的人。","second":"朋友不算多，但有几个可以无话不谈。"},{"id":7,"dim":"EI","n":7,"top":"first","prompt":"学一样新东西。","first":"喜欢边做边和人交流，在讨论里学得快。","second":"喜欢先自己看材料，琢磨透了再动手。"},{"id":8,"dim":"EI","n":8,"top":"second","prompt":"心里冒出一个新想法。","first":"很想马上说给别人听，听听大家的反应。","second":"喜欢先在心里放一放，想成熟了再说。"},{"id":9,"dim":"EI","n":9,"top":"first","prompt":"你理想的工作环境。","first":"开放热闹，有人可以随时交流。","second":"安静少打扰，可以专心做事。"},{"id":10,"dim":"EI","n":10,"top":"second","prompt":"别人问你周末过得怎么样。","first":"能聊挺多，从这件事说到那件事。","second":"简单说几句，除非对方真的感兴趣。"},{"id":11,"dim":"EI","n":11,"top":"first","prompt":"一个人去陌生的城市旅行。","first":"喜欢和当地人或同行的人搭话。","second":"喜欢自己慢慢逛，不太需要交谈。"},{"id":12,"dim":"EI","n":12,"top":"second","prompt":"说到你的兴趣爱好。","first":"喜欢的东西挺多，每样都能聊上几句。","second":"喜欢的东西不多，但每样都钻得比较深。"},{"id":13,"dim":"SN","n":1,"top":"second","prompt":"听别人讲一件事。","first":"记得具体发生了什么、谁说了什么。","second":"记得大概的意思，以及它让我想到了什么。"},{"id":14,"dim":"SN","n":2,"top":"first","prompt":"拿到一项新任务。","first":"先看清楚具体要求，一步一步来。","second":"先想清楚最终要达成什么，再找自己的做法。"},{"id":15,"dim":"SN","n":3,"top":"second","prompt":"别人夸你，哪种更让你高兴？","first":"做事踏实，交给你很放心。","second":"有想法，常能想到别人想不到的。"},{"id":16,"dim":"SN","n":4,"top":"first","prompt":"看一部电影。","first":"更在意情节合不合理、细节真不真实。","second":"更在意它想表达什么、留给我的余味。"},{"id":17,"dim":"SN","n":5,"top":"second","prompt":"给朋友指路。","first":"说具体的：过两个路口，看到药店右转。","second":"说大概的：往东走，商场那一片就是。"},{"id":18,"dim":"SN","n":6,"top":"first","prompt":"安排一件以前做过的事。","first":"用以前验证过的办法，稳妥省心。","second":"想试试新办法，说不定效果更好。"},{"id":19,"dim":"SN","n":7,"top":"second","prompt":"大家讨论问题时，你更常说的是：","first":"“具体怎么做？先把眼前的解决了。”","second":"“再往后想想，这件事会变成什么样？”"},{"id":20,"dim":"SN","n":8,"top":"first","prompt":"学用一个新软件。","first":"跟着教程，一步一步操作。","second":"先摸清整体逻辑，再自己摸索着用。"},{"id":21,"dim":"SN","n":9,"top":"second","prompt":"向别人描述一个地方。","first":"说那里有什么、长什么样。","second":"说那里给人什么感觉、像什么。"},{"id":22,"dim":"SN","n":10,"top":"first","prompt":"做判断时，你更相信：","first":"亲眼见过、亲身经历过的事。","second":"自己的直觉和预感。"},{"id":23,"dim":"SN","n":11,"top":"second","prompt":"布置自己的房间。","first":"先量好尺寸，想清楚每样东西放哪。","second":"先想要一种什么氛围，细节边做边定。"},{"id":24,"dim":"SN","n":12,"top":"first","prompt":"做重复的日常工作。","first":"做熟了心里踏实，能又快又好。","second":"容易觉得没意思，总想改改流程。"},{"id":25,"dim":"TF","n":1,"top":"first","prompt":"朋友找你倾诉烦恼。","first":"帮他分析问题出在哪，想想怎么解决。","second":"先陪着他，让他觉得有人理解。"},{"id":26,"dim":"TF","n":2,"top":"second","prompt":"要做一个两难的决定。","first":"主要看哪个选项更合理、更有效。","second":"主要看它对相关的人意味着什么。"},{"id":27,"dim":"TF","n":3,"top":"first","prompt":"同事的方案有个明显的漏洞。","first":"直接指出来，早改早好。","second":"先肯定他的用心，再委婉地提出来。"},{"id":28,"dim":"TF","n":4,"top":"second","prompt":"评价一件事办得好不好。","first":"看目标有没有达到、标准是否一致。","second":"看大家是不是觉得被尊重、被照顾到了。"},{"id":29,"dim":"TF","n":5,"top":"first","prompt":"熟人更常这样形容你：","first":"讲道理，看问题客观。","second":"体贴，有人情味。"},{"id":30,"dim":"TF","n":6,"top":"second","prompt":"团队里起了争执。","first":"先弄清楚谁说得对，按事实来。","second":"先让气氛缓下来，照顾到每个人的感受。"},{"id":31,"dim":"TF","n":7,"top":"first","prompt":"收到一条批评。","first":"我更在意它有没有道理。","second":"我更在意对方说话的方式和态度。"},{"id":32,"dim":"TF","n":8,"top":"second","prompt":"分一笔团队奖金。","first":"按规则和贡献分，一视同仁。","second":"也考虑每个人的处境和难处。"},{"id":33,"dim":"TF","n":9,"top":"first","prompt":"看到一条有争议的新闻。","first":"先想事实是否成立、逻辑通不通。","second":"先想到当事人的处境和感受。"},{"id":34,"dim":"TF","n":10,"top":"second","prompt":"给朋友挑礼物。","first":"挑实用的，对方确实用得上。","second":"挑有心意的，能让对方感动。"},{"id":35,"dim":"TF","n":11,"top":"first","prompt":"朋友问你：“我这件事做得对吗？”","first":"照实说我的判断，哪怕不中听。","second":"顾及他此刻的心情，挑合适的方式说。"},{"id":36,"dim":"TF","n":12,"top":"second","prompt":"你更受不了哪一种？","first":"做事没逻辑，前后矛盾。","second":"待人冷漠，不顾别人感受。"},{"id":37,"dim":"JP","n":1,"top":"second","prompt":"周末出去玩。","first":"提前定好去哪、几点出发、吃什么。","second":"定个大概方向，到时候看心情。"},{"id":38,"dim":"JP","n":2,"top":"first","prompt":"有一项一周后截止的工作。","first":"尽早开始，按计划一点点做完。","second":"先酝酿着，临近截止时效率最高。"},{"id":39,"dim":"JP","n":3,"top":"second","prompt":"计划被临时打乱了。","first":"有点烦，想尽快重新排好。","second":"还好，正好看看有没有别的机会。"},{"id":40,"dim":"JP","n":4,"top":"first","prompt":"你的桌面或电脑文件夹。","first":"东西有固定位置，找起来很方便。","second":"看着有点乱，但我自己知道在哪。"},{"id":41,"dim":"JP","n":5,"top":"second","prompt":"面对几个选项时。","first":"喜欢早点定下来，心里踏实。","second":"喜欢多留一阵，看看还有没有更好的。"},{"id":42,"dim":"JP","n":6,"top":"first","prompt":"出门旅行收拾行李。","first":"提前列好清单，一样样收好。","second":"出发前一晚，想到什么装什么。"},{"id":43,"dim":"JP","n":7,"top":"second","prompt":"一天开始的时候。","first":"心里有张待办清单，按顺序处理。","second":"看当天情况，哪件事有感觉就先做。"},{"id":44,"dim":"JP","n":8,"top":"first","prompt":"一件事已经有了结论。","first":"定了就照办，不想再反复。","second":"有新情况的话，随时可以再改。"},{"id":45,"dim":"JP","n":9,"top":"second","prompt":"逛街或网购。","first":"想好要买什么，买完就走。","second":"喜欢随便逛逛，常有意外收获。"},{"id":46,"dim":"JP","n":10,"top":"first","prompt":"手上同时有好几件事。","first":"做完一件再开始下一件。","second":"几件事穿插着做，换着来不累。"},{"id":47,"dim":"JP","n":11,"top":"second","prompt":"约朋友吃饭。","first":"提前几天约好时间和地点。","second":"当天临时约，说走就走。"},{"id":48,"dim":"JP","n":12,"top":"first","prompt":"公司有很细的规章制度。","first":"有章可循，做事心里有底。","second":"规定太细，觉得被束缚。"}],"types":{"ESTJ":{"one":"务实、果断，善于组织人和事，高效地把事情做成。","desc":"你务实、讲事实，决定得快，也落实得快。你善于组织项目和人员，用最有效率的方式取得结果，也会照管好日常细节。你有一套清楚的逻辑标准，自己严格遵循，也希望别人这样做。","role":"主事人","role_en":"Organizer","role_group":"守序派","group_en":"Order Keepers","tagline":"把人和事安排明白，让计划按时落地。"},"ESTP":{"one":"灵活务实，着眼眼前的结果，喜欢用行动解决问题。","desc":"你务实、灵活，关心此时此地，希望事情立刻见效。比起长篇的理论，你更愿意动手去解决问题。你随性，享受和人一起做事的时刻，在实践中学得最快。","role":"闯将","role_en":"Trailblazer","role_group":"应变派","group_en":"Improvisers","tagline":"先上手再说，在行动里找答案。"},"ESFJ":{"one":"热心、认真、乐于合作，用心照顾身边人的需要。","desc":"你热心、认真，希望身边的环境和睦，并愿意为此付出努力。你喜欢和人合作，准确、按时地完成任务，小事也会善始善终。你留意别人日常的需要并设法满足，也希望自己的付出被看到。","role":"张罗人","role_en":"Host","role_group":"守序派","group_en":"Order Keepers","tagline":"热心张罗，让每个人都被照顾到。"},"ESFP":{"one":"外向、友善、热爱生活，能让工作变得有趣。","desc":"你热爱生活，也喜欢人，喜欢和大家一起把事情办成。你把常识和实在的态度带到工作里，还能让工作变得有趣。你灵活随性，很快就能适应新的人和环境，和别人一起尝试新东西时学得最好。","role":"开心果","role_en":"Sunshine","role_group":"应变派","group_en":"Improvisers","tagline":"走到哪里，热闹和笑声就跟到哪里。"},"ENTJ":{"one":"坦率、果断，乐于领导，善于发现低效并建立制度。","desc":"你坦率、果断，愿意承担领导的责任。你能很快看出不合逻辑、效率低的流程，并建立一套完整的制度来解决问题。你喜欢长远规划、设定目标，乐于学习，也喜欢把知识教给别人。","role":"掌舵人","role_en":"Helmsman","role_group":"求真派","group_en":"Truth Seekers","tagline":"看准方向，带着队伍一路向前。"},"ENTP":{"one":"敏捷、机智、直言，喜欢解决新的难题。","desc":"你思维敏捷、反应快，能激发身边的人。你擅长解决新的、有挑战的问题，先想出各种可能，再从策略上加以分析。你善于看人，厌倦例行公事，很少用同一种方式做同一件事。","role":"破题人","role_en":"Reframer","role_group":"求真派","group_en":"Truth Seekers","tagline":"换个角度看问题，总能找到新解法。"},"ENFJ":{"one":"温暖、有同理心，善于看到别人的潜力并帮他们成长。","desc":"你温暖、反应敏锐、有责任感，对别人的情绪、需要和动机很敏感。你在每个人身上都能看到潜力，想帮他们实现出来，常常是推动个人和团队成长的那个人。你善于交往，能在团体里鼓舞人心。","role":"召集人","role_en":"Convener","role_group":"寻意派","group_en":"Meaning Seekers","tagline":"把人聚到一起，朝同一个方向出发。"},"ENFP":{"one":"热情、富有想象力，总能看到生活里的各种可能。","desc":"你热情洋溢，觉得生活充满可能。你能很快把各种信息联系起来，凭着看到的规律自信地行动。你需要别人的肯定，也乐于给别人赞赏和支持。你随性灵活，常常靠即兴发挥和好口才解决问题。","role":"点火人","role_en":"Igniter","role_group":"寻意派","group_en":"Meaning Seekers","tagline":"满脑子新可能，还能把大家的热情点起来。"},"ISTJ":{"one":"安静、可靠，想清楚该做什么，然后稳稳地做完。","desc":"你务实、讲事实，靠周密和可靠把事情做成。决定了该做什么，就按部就班地推进，不容易被打扰。你喜欢把工作和生活安排得井井有条，看重承诺和传统。","role":"守约人","role_en":"Keeper","role_group":"守序派","group_en":"Order Keepers","tagline":"答应的事，就一件件扎实做到。"},"ISTP":{"one":"安静的观察者，问题一来就动手找出可行的办法。","desc":"你平时宽容、随和，在旁边安静地观察；问题一出现，你会迅速行动，找到真正管用的办法。你喜欢弄清东西是怎么运作的，能很快从一堆信息里抓住关键，看重因果、逻辑和效率。","role":"巧手匠","role_en":"Tinkerer","role_group":"应变派","group_en":"Improvisers","tagline":"拆开、弄懂、修好，靠的是一双手。"},"ISFJ":{"one":"安静、友善、负责，记得对别人重要的小事。","desc":"你认真、体贴、做事细致，答应的事会稳稳当当地做到。你留意身边人的具体情况，在意他们的感受，愿意花心思营造一个有序又和睦的环境。","role":"照看人","role_en":"Caretaker","role_group":"守序派","group_en":"Order Keepers","tagline":"默默把身边的人照顾周到。"},"ISFP":{"one":"安静、友善、敏感，享受当下，忠于自己的价值观。","desc":"你温和、体贴，享受身边正在发生的事情。你喜欢有自己的空间，按自己的节奏做事。你忠于自己的价值观和在乎的人，不喜欢争执，也不会把自己的看法强加给别人。","role":"调色师","role_en":"Colorist","role_group":"应变派","group_en":"Improvisers","tagline":"用自己的方式感受世界，也让它更好看一点。"},"INTJ":{"one":"有独到的想法和很强的执行力，善于看清长远的格局。","desc":"你能很快从纷杂的事情里看出规律，形成自己的长远判断，并且有很强的动力把想法变成现实。一旦投入，你会把事情组织起来做到底。你独立、爱质疑，对自己和别人的能力都有很高的标准。","role":"布局者","role_en":"Strategist","role_group":"求真派","group_en":"Truth Seekers","tagline":"先想清终局，再一步步落子。"},"INTP":{"one":"对感兴趣的一切都想找出合乎逻辑的解释。","desc":"你偏爱理论和抽象，对想法的兴趣常常超过对社交的兴趣。你安静、灵活，在感兴趣的领域能非常专注，解决问题的能力很强。你习惯质疑和分析，有时会显得挑剔。","role":"解谜人","role_en":"Puzzler","role_group":"求真派","group_en":"Truth Seekers","tagline":"对一切规律都好奇，非要弄明白为什么。"},"INFJ":{"one":"在想法和关系里寻找意义，对人有洞察，按坚定的价值观行事。","desc":"你想弄清事情背后的意义，也想理解人们的动机，常常比别人更早看到一件事会往哪里走。你认真、有原则，对怎样让大家过得更好有清晰的想象，并且会有条理地去实现它。","role":"掌灯人","role_en":"Lamplighter","role_group":"寻意派","group_en":"Meaning Seekers","tagline":"看得远一点，也愿意替别人照亮前路。"},"INFP":{"one":"理想主义，忠于自己的价值，想帮别人活出更好的自己。","desc":"你希望自己的生活和所做的事与内心的价值一致。你好奇，很快能看到各种可能，常常能把一个想法变成现实的起点。你努力理解别人，帮他们发挥潜力；平时灵活包容，触及原则时会很坚定。","role":"织梦人","role_en":"Dreamweaver","role_group":"寻意派","group_en":"Meaning Seekers","tagline":"心里装着一个更好的世界，慢慢把它织出来。"}},"theory":{"functions":{"Se":{"name":"外倾实感","kw":"体验","does":"关注此时此地的真实情况，喜欢亲身去体验、马上去行动。","grip":"你可能纠缠在外界琐碎的细节里，或者在吃喝玩乐上放纵，觉得周围充满敌意。"},"Si":{"name":"内倾实感","kw":"记忆","does":"把眼前的情况和过去的经验对照，对具体细节记得很牢。","grip":"你可能钻进一些零散的事实和细节里出不来，变得退缩、低落，或者过分担心身体的小毛病。"},"Ne":{"name":"外倾直觉","kw":"联想","does":"在外部世界里看到各种可能，善于把想法联系起来，再分享出去。","grip":"你可能忽然看不清事实和细节，冲动行事，或者被各种可能的坏结果吓到，把未来想得很糟。"},"Ni":{"name":"内倾直觉","kw":"远见","does":"把零散的意象和线索串起来，用新的角度看事情，相信内心的洞见。","grip":"你可能冒出“要出大事了”的念头，把未来想成一场灾难，或者在没有意义的地方硬找意义。"},"Te":{"name":"外倾思考","kw":"组织","does":"在外部世界里追求逻辑和秩序，善于组织人和资源去达成目标。","grip":"你可能变得对别人很挑剔、很严厉，急着动手去纠正问题，结果往往适得其反。"},"Ti":{"name":"内倾思考","kw":"分析","does":"追求想法内部的严密和自洽，能进入专注、客观的分析状态。","grip":"你可能对自己格外苛刻，觉得自己不够好，变得低落、退缩，看事情非黑即白。"},"Fe":{"name":"外倾情感","kw":"和谐","does":"关心人与人之间是否融洽，乐于鼓励别人，在意大家的感受。","grip":"你可能情绪起伏很大，在关系里变得格外敏感，反应比平时强烈很多。"},"Fi":{"name":"内倾情感","kw":"价值","does":"让自己的行动和想法与内心的价值保持一致，敏感而有同理心。","grip":"你可能对情绪变得很敏感，却又努力把它压住、藏起来，害怕被强烈的感受淹没。"}},"dims":{"EI":{"label":"精力从哪里来","mid":"和人在一起、自己独处都能让你充电，要看当时的状态和场合。","poles":{"E":{"name":"外倾","means":"和人交流、参与外面的事情让你充满能量，你常常边说边想。","tip":"偏好内倾的人想清楚了才开口。开会前把议题发给他们，给他们一点时间，往往能听到更好的想法。"},"I":{"name":"内倾","means":"独处和安静的思考让你恢复精力，你习惯想清楚了再说。","tip":"偏好外倾的人边说边想，第一句话不一定是结论。你需要时间时，可以直接说“我想一下再回复你”。"}}},"SN":{"label":"怎样接收信息","mid":"你既看重具体的事实，也会留意背后的可能，两种方式都用得上。","poles":{"S":{"name":"实感","means":"你更相信具体的事实和亲身经验，注重细节和实际。","tip":"偏好直觉的人先讲大方向和可能性。先听完他们的整体想法，再一起把细节补上。"},"N":{"name":"直觉","means":"你更留意事情之间的联系和可能性，喜欢先看整体和未来。","tip":"偏好实感的人想先听具体的例子和事实，再听你看到的整体方向。"}}},"TF":{"label":"怎样做决定","mid":"做决定时你会同时掂量道理和人情，哪边多一点要看事情。","poles":{"T":{"name":"思考","means":"做决定时你更看重逻辑和客观标准，对事不对人。","tip":"偏好情感的人在意事情对人的影响。提意见前先肯定对方的用心，他们会更愿意听你讲道理。"},"F":{"name":"情感","means":"做决定时你更看重价值和人的感受，希望大家都被照顾到。","tip":"偏好思考的人对事不对人。他们直接指出问题，往往是在解决事情，不是针对你。"}}},"JP":{"label":"怎样面对外部世界","mid":"你有时喜欢计划，有时更愿意随机应变，取决于事情和场合。","poles":{"J":{"name":"判断","means":"你喜欢事情有计划、有结论，早点定下来会让你安心。","tip":"偏好感知的人喜欢把选项留到最后。约定一个最晚的决定时间，比反复催更有用。"},"P":{"name":"感知","means":"你喜欢保持弹性，随着新情况调整，不急着下结论。","tip":"偏好判断的人需要确定感。哪怕还没想好，也先告诉他们你打算什么时候给答复。"}}}},"identity":{"label":"身份 / Identity（A 还是 T）","intro":"除了四个字母，16Personalities 还加了第五个维度——身份（Identity），用来描述你有多在意外界评价、对自己的情绪和表现有多确定。它不改变你是哪一型，只给同一型增添一点底色。本测试没有测这一维，这里只做说明，帮你理解结果里带的 -A / -T 后缀。","note":"身份维度大致对应心理学“大五”里的情绪稳定性，和前四个字母是相互独立的。","poles":{"A":{"name":"坚决型（Assertive，-A）","means":"对自己比较笃定，不太被外界评价和压力左右，遇到挫折恢复得快，整体更放松、更自信。","watch":"好处是稳，代价是有时会忽略值得在意的信号，或听不进不同意见。"},"T":{"name":"起伏型（Turbulent，-T）","means":"对自己的表现要求更高，更在意别人的看法，情绪起伏更明显。这股“还能更好”的劲常推着你不断改进。","watch":"好处是上进、细心，代价是容易内耗、过度自我批评。"}       if (t > 0) { res = {letter: d.b, pct: 50 + 50 * t, tie: false}; }
      else if (t < 0) { res = {letter: d.a, pct: 50 - 50 * t, tie: false}; }
      else { res = {letter: d.b, pct: 50, tie: true}; }
      res.n = count;
      res.sum = sum;
      out[d.k] = res;
    });
    return out;
  }

  function band(p) {
    if (p < MID_LIMIT) { return {key: 'mid', label: '接近中间'}; }
    if (p < 67) { return {key: 'mild', label: '轻微'}; }
    if (p < 80) { return {key: 'clear', label: '明显'}; }
    return {key: 'strong', label: '非常明显'};
  }

  function wOf(p) {
    var t = Math.max(0, Math.min(1, (p - 50) / 50));
    return Math.round(110 + 790 * Math.pow(t, 0.85));
  }

  function flip(letter) {
    for (var i = 0; i < DIMS.length; i++) {
      if (DIMS[i].a === letter) { return DIMS[i].b; }
      if (DIMS[i].b === letter) { return DIMS[i].a; }
    }
    return letter;
  }

  function makeResult(len, answers) {
    var sc = computeScores(idsFor(len), answers);
    var code = DIMS.map(function (d) { return sc[d.k].letter; }).join('');
    var dims = {};
    DIMS.forEach(function (d) { dims[d.k] = {letter: sc[d.k].letter, pct: sc[d.k].pct, tie: sc[d.k].tie}; });
    return {v: 1, len: len, code: code, dims: dims, answers: answers, at: Date.now()};
  }

  function view(r) {
    return DIMS.map(function (d, i) {
      var x = r.dims[d.k];
      var p = Math.round(x.pct);
      return {k: d.k, i: i, letter: x.letter, p: p, b: band(p), u: p < MID_LIMIT, tie: !!x.tie, w: wOf(p)};
    });
  }

  function altCode(code, i) {
    return code.split('').map(function (c, j) { return j === i ? flip(c) : c; }).join('');
  }

  function shareHash(r) {
    return '#/r/' + r.code + '-' + DIMS.map(function (d) { return Math.round(r.dims[d.k].pct); }).join('-');
  }

  function parseShared(h) {
    var m = /^#\/r\/([EI])([SN])([TF])([JP])-(\d{2,3})-(\d{2,3})-(\d{2,3})-(\d{2,3})$/.exec(h || '');
    if (!m) { return null; }
    var dims = {};
    for (var i = 0; i < 4; i++) {
      var p = parseInt(m[5 + i], 10);
      if (!(p >= 50 && p <= 100)) { return null; }
      dims[DIMS[i].k] = {letter: m[1 + i], pct: p, tie: p === 50};
    }
    return {v: 1, code: m[1] + m[2] + m[3] + m[4], dims: dims, shared: true};
  }

  function esc(s) {

    });

  function startQuiz(len) {

  function drawQuestion(animate) {
    var p = getProg();

    var it = ITEM[id];
    var a = p.answers[id];
    var answered = a !== undefined;
    setBar('<button class="icon-btn" data-act="prev" aria-label="上一题">' + ICON_BACK + '</button>',
      '<span class="count" aria-hidden="true">' + (p.idx + 1) + ' <span>/ ' + p.ids.length + '</span></span>',
      answered ? '<button class="navlink" data-act="next">下一题</button>' : '');
    var ticks = '';
    for (var i = 0; i < p.ids.length; i++) {
      var cls = i === p.idx ? 'c' : (p.answers[p.ids[i]] !== undefined ? 'd' : '');
      ticks += '<i class="' + cls + '"></i>';
    }
    document.getElementById('ticks').innerHTML = ticks;
    var topText = it.top === 'first' ? it.first : it.second;
    var botText = it.top === 'first' ? it.second : it.first;
    var html = '<h1 class="prompt">' + esc(it.prompt) + '</h1>';
    html += '<p class="st" id="stTop">' + esc(topText) + '</p>';
    html += '<div class="opts" role="radiogroup" aria-label="选更像你的一句">';
    OPTS.forEach(function (o, v) {
      var on = a === v;
      var tab = on || (!answered && v === 0) ? '0' : '-1';
      html += '<button class="ans' + (o.strong ? ' strong' : '') + '" role="radio" aria-checked="' + on + '" tabindex="' + tab + '" data-act="ans" data-v="' + v + '">' + o.icon + '<span>' + o.t + '</span></button>';
    });
    html += '</div>';
    html += '<p class="st" id="stBot">' + esc(botText) + '</p>';
    if (p.idx < 2) {
      html += '<p class="hint">选中的那句会变粗。拿不准时，选更接近你平时第一反应的一边。选完自动进入下一题，点左上角可以回去改。</p>';
    }
    var q = document.getElementById('q');
    q.innerHTML = html;
    if (animate && !reduced) {
      q.classList.remove('fade');
      void q.offsetWidth;
      q.classList.add('fade');

  function applyWeights(a) {
    var top = document.getElementById('stTop');
    var bot = document.getElementById('stBot');
    if (!top || !bot) { return; }
    var tc = '', bc = '';
    if (a === 0) { tc = 'w-heavy'; bc = 'w-light'; }
    else if (a === 1) { tc = 'w-med'; bc = 'w-light'; }
    else if (a === 2) { tc = 'w-light'; bc = 'w-med'; }
    else if (a === 3) { tc = 'w-light'; bc = 'w-heavy'; }
    top.className = 'st ' + tc;
    bot.className = 'st ' + bc;
  }

  function answer(v) {
    if (advancing) { return; }
    var p = getProg();
    if (!p) { return; }
    var id = p.ids[p.idx];
    p.answers[id] = v;
    store.set(KEY_P, p);
    Array.prototype.forEach.call(main.querySelectorAll('.ans'), function (b) {
      var on = +b.getAttribute('data-v') === v;
      b.setAttribute('aria-checked', String(on));
      b.setAttribute('tabindex', on ? '0' : '-1');
    });
    applyWeights(v);
    if (lastKeyboard) {
      var sel = main.querySelector('.ans[aria-checked="true"]');
      if (sel) { sel.focus(); }
    }
    advancing = true;
    setTimeout(function () {
      advancing = false;
      if (currentView !== 'quiz') { return; }
      step(1);
    }, reduced ? 150 : 320);
  }

  function step(dir) {
    var p = getProg();
    if (!p) { return; }
    if (dir > 0) {
      if (p.answers[p.ids[p.idx]] === undefined) { return; }
      if (p.idx >= p.ids.length - 1) {
        var firstOpen = -1;
        for (var i = 0; i < p.ids.length; i++) { if (p.answers[p.ids[i]] === undefined) { firstOpen = i; break; } }
        if (firstOpen >= 0) { p.idx = firstOpen; store.set(KEY_P, p); drawQuestion(true); return; }
        finish(p);
        return;
      }
      p.idx += 1;
    } else {
      if (p.idx === 0) { go('#/'); return; }
      p.idx -= 1;
    }
    store.set(KEY_P, p);
    drawQuestion(true);
  }

  /* ---------- result image ---------- */
  function wrapText(ctx, text, x, y, maxW, lh) {
    var chars = Array.from(text);
    var lines = [], line = '';
    var noStart = '，。、；：！？）》”」';
    for (var i = 0; i < chars.length; i++) {
      var ch = chars[i];
      var test = line + ch;
      if (ctx.measureText(test).width > maxW && line) {
        if (noStart.indexOf(ch) >= 0) { line = test; continue; }
        lines.push(line);
        line = ch;
      } else {
        line = test;
      }
    }
    if (line) { lines.push(line); }
    lines.forEach(function (l, j) { ctx.fillText(l, x, y + j * lh); });
    return y + (lines.length - 1) * lh;
  }

      var ta = document.createElement('textarea');

      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(t).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

    } else if (act === 'img') {
      r = store.get(KEY_R);
      if (!r) { return; }
      t.disabled = true;
      var label = t.textContent;
      t.textContent = '正在生成…';
      makeImage(r).then(function (url) {
        t.disabled = false; t.textContent = label;
        openSheet('<h2 id="sheetT">结果图</h2><p class="note">手机上长按图片可以保存；电脑上点“下载图片”。</p><img src="' + url + '" alt="' + esc('MBTI 十六型偏好自测结果图：' + r.code) + '"><div class="row mt16"><a class="btn sec" download="MBTI十六型偏好自测-' + r.code + '.png" href="' + url + '">下载图片</a><button class="btn" data-act="close">关闭</button></div>');
      }, function () {
        t.disabled = false; t.textContent = label;
        toast('生成失败，可以直接截图保存');
      });
    } else if (act === 'copy') {
      r = store.get(KEY_R);
      if (!r) { return; }
      var url = shareUrl(r);
      copyText(url).then(function (ok) {
        if (ok) { toast('已复制结果链接'); return; }
        openSheet('<h2 id="sheetT">结果链接</h2><p class="note">长按下面的链接，选择“全选”和“复制”。</p><input type="text" readonly value="' + esc(url) + '" aria-label="结果链接"><div class="mt16"><button class="btn" data-act="close">关闭</button></div>');
        var inp = sheet.querySelector('input');
        if (inp) { inp.select(); }
      });
    } else if (act === 'close') {
      closeSheet();
    } else if (act === 'reset') {
      var cf = document.getElementById('confirm');
      if (cf) { cf.hidden = false; t.hidden = true; var y = cf.querySelector('[data-act="reset-no"]'); if (y) { y.focus(); } }
    } else if (act === 'reset-no') {
      var cf2 = document.getElementById('confirm');
      if (cf2) { cf2.hidden = true; }
      var rb = main.querySelector('[data-act="reset"]');
      if (rb) { rb.hidden = false; rb.focus(); }
    } else if (act === 'reset-yes') {
      store.del(KEY_R);
      store.del(KEY_P);
      go('#/');
    } else if (act === 'wipe') {
      store.del(KEY_R);
      store.del(KEY_P);
      store.del(KEY_U);
      PAID = null;
      toast('已清除本机记录');
    }
  });

  document.addEventListener('pointerdown', function () { lastKeyboard = false; }, true);
  document.addEventListener('keydown', function (e) {
    lastKeyboard = true;
    if (e.key === 'Escape' && !sheet.hidden) { closeSheet(); return; }
    if (e.key === 'Enter' && e.target && e.target.id === 'ucode') { e.preventDefault(); submitUnlock(); return; }
    if (currentView !== 'quiz' || e.altKey || e.ctrlKey || e.metaKey || !sheet.hidden) { return; }
    var k = e.key;
    if (k === '1' || k === '2' || k === '3' || k === '4') {
      e.preventDefault();
      answer(+k - 1);
    } else if (k === 'ArrowLeft' || k === 'Backspace') {
      e.preventDefault();
      step(-1);
    } else if (k === 'ArrowRight') {
      e.preventDefault();
      step(1);
    } else if (k === 'ArrowDown' || k === 'ArrowUp') {
      var btns = Array.prototype.slice.call(main.querySelectorAll('.ans'));
      var cur = btns.indexOf(document.activeElement);
      if (!btns.length) { return; }
      e.preventDefault();
      var nxt = cur < 0 ? 0 : (cur + (k === 'ArrowDown' ? 1 : btns.length - 1)) % btns.length;
      btns.forEach(function (b, j) { b.setAttribute('tabindex', j === nxt ? '0' : '-1'); });
      btns[nxt].focus();
    }
  });

  /* ---------- router ---------- */
  var currentView = '';
  var lastHash = '', shownHash = '';
  function route() {
    var h = location.hash || '#/';
    if (h !== shownHash) { lastHash = shownHash; shownHash = h; }
    if (!sheet.hidden) { closeSheet(); }
    var openIt = wantDetail;
    wantDetail = false;
    if (h.indexOf('#/u/') === 0) {
      var raw = h.slice(4);
      try { raw = decodeURIComponent(raw); } catch (e) { /* use it as typed */ }
      var u = tryUnlock(raw);
      wantDetail = u.state === 'ok';
      history.replaceState(null, '', store.get(KEY_R) ? '#/result' : '#/types');
      route();
      toast(u.state === 'ok' ? '已解锁全部 16 型的详细解读' : u.state === 'revoked' ? '这个解锁码已停用' : '链接里的解锁码不对');
      return;
    }
    var shared = parseShared(h);
    if (shared) { currentView = 'shared'; renderResult(shared, true); settle(); return; }
    if (h === '#/q') { currentView = 'quiz'; renderQuiz(); settle('.prompt'); return; }
    if (h === '#/result') { currentView = 'result'; renderResult(store.get(KEY_R), false, openIt); settle(openIt ? '#detail h2' : ''); return; }
    if (h === '#/types') { currentView = 'types'; renderTypes(); settle(); return; }
    var tm = /^#\/type\/([^\/]*)(?:\/from\/(.+))?$/.exec(h);
    if (tm) { currentView = 'type'; renderType(tm[1].toUpperCase(), tm[2] || ''); settle(); return; }
    if (h === '#/about') { currentView = 'about'; renderAbout(); settle(); return; }
    currentView = 'home';
    renderHome();
    settle();
  }

  window.addEventListener('hashchange', route);
  window.MBTI16 = {computeScores: computeScores, band: band, wOf: wOf, idsFor: idsFor, makeResult: makeResult,
    parseShared: parseShared, shareHash: shareHash, makeImage: makeImage, data: D, keys: [KEY_P, KEY_R]};
  route();
})();
</script>
</body>
</html>
