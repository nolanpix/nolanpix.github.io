name = "nolanpix-counter"
main = "counter.js"
compatibility_date = "2026-11-01"

# Workers Free plan is enough (100k requests/day). No custom domain needed:
# after deploy the endpoint is https://nolanpix-counter.<your-subdomain>.workers.dev
#
# Bind a KV namespace named COUNTER. Create it first, then paste its id below:
#   wrangler kv namespace create COUNTER      (older wrangler: wrangler kv:namespace create COUNTER)
# Copy the printed id into the line below, then: wrangler deploy
[[kv_namespaces]]
binding = "COUNTER"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"
